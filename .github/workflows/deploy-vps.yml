# Deploy EcoBrains LMS on the Contabo self-hosted runner (contabo-cd).
#
# One-time on the VPS (as root):
#   echo 'github-runner ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/github-runner
#   chmod 440 /etc/sudoers.d/github-runner
#   visudo -cf /etc/sudoers.d/github-runner
#
# Keep /root/campus_drive_updated/.env on the server only — it is never overwritten.
#
# Runner work folder must stay the default _work (not /root/...).

name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    # Match the default labels from config.sh (not the runner *name* contabo-cd).
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      DEPLOY_DIR: /root/campus_drive_updated

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync tree to ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          sudo mkdir -p "${DEPLOY_DIR}"
          sudo rsync -a --delete \
            --filter 'P .env' \
            --filter 'P backend.env' \
            --exclude '.env' \
            --exclude 'backend.env' \
            --exclude '.git/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'frontend/dist/' \
            --exclude 'backend/target/' \
            "${GITHUB_WORKSPACE}/" "${DEPLOY_DIR}/"
          sudo chown -R root:root "${DEPLOY_DIR}"
          # github-runner cannot stat files under /root (mode 700); use sudo.
          if sudo test -f "${DEPLOY_DIR}/.env"; then
            sudo chmod 600 "${DEPLOY_DIR}/.env"
          else
            echo "::error::Missing ${DEPLOY_DIR}/.env — copy .env.example on the VPS first."
            exit 1
          fi

      - name: Build and deploy (vps.sh)
        run: |
          set -euo pipefail
          sudo env DEPLOY_USER=root \
            bash "${DEPLOY_DIR}/scripts/vps.sh" deploy --with-nginx

      - name: Health check
        run: sudo bash "${DEPLOY_DIR}/scripts/vps.sh" status
