services:

  mysql:
    image: mysql:8.0
    container_name: raju-lms-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ecobrains_lms

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

    networks:
      - lms-network

  redis:
    image: redis:7-alpine
    container_name: raju-lms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - lms-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: raju-lms-backend
    restart: unless-stopped

    # Wait until MySQL/Redis actually accept connections; otherwise the backend
    # can crash on first start and the login page shows "Login failed".
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      TZ: Asia/Kolkata

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecobrains_lms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE: Asia/Kolkata
      SPRING_JACKSON_TIME_ZONE: Asia/Kolkata

      REDIS_HOST: redis
      REDIS_PORT: 6379

      APP_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin@ecobrains.com}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      APP_ADMIN_URL_KEY: ${ADMIN_URL_KEY:-eb-admin-2026}

      APP_JWT_SECRET: ${JWT_SECRET:-xdw8YNnbJhtiPxzdA5Y6Nkw1x0KrHV24ZW7Iefev+ATlWL/EOxRuUG0Sas8d0fFS}

      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}

    ports:
      - "8080:8080"

    networks:
      - lms-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_URL_KEY: ${ADMIN_URL_KEY:-eb-admin-2026}

    container_name: raju-lms-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - lms-network


networks:
  lms-network:


volumes:
  mysql_data:
  redis_data: