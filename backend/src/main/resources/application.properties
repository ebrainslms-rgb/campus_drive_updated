# ─────────────────────────────────────────────────────────────────────────
# EcoBrains LMS Backend - application.properties
#
# For local development. For production, override every value below via
# environment variables / a separate application-prod.properties profile -


spring.application.name=lms-backend
server.port=8080

# ── Database (MySQL) ────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ecobrains_lms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ── Timezone ─────────────────────────────────────────────────────────────
# The institute's drives are conducted in IST; the backend is authoritative
# for exam timing and always evaluates deadlines in this zone regardless of
# where the server or the student's browser physically is.
spring.jackson.time-zone=Asia/Kolkata

# ── Admin credentials (never hard-coded in Java source) ───────────────────
# Change these for your environment. Not exposed to the frontend, never logged.
app.admin.username=admin@ecobrains.com
app.admin.password=admin123
# Extra shared secret required by the frontend's admin URL prefix (/{key}/admin).
# Rotate this independently of the admin password if you need to invalidate
# old bookmarked admin URLs.
app.admin.url-key=eb-admin-2026

# ── JWT ─────────────────────────────────────────────────────────────────
# Base64-encoded HMAC-SHA256 signing key. Generate your own for production, e.g.:
#   openssl rand -base64 48
app.jwt.secret=xdw8YNnbJhtiPxzdA5Y6Nkw1x0KrHV24ZW7Iefev+ATlWL/EOxRuUG0Sas8d0fFS
app.jwt.admin-expiration-ms=28800000
app.jwt.student-expiration-ms=10800000

# ── CORS ────────────────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── File upload (question CSV) ─────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ─────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.ecobrains.lms=INFO
